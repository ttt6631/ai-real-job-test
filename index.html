function filterQuals(term=""){
 const t=String(term||"").trim().toLowerCase();
 const list=ALL_QUALIFICATIONS.filter(q=>{
   if(!t)return true;
   const hay=[q.name,q.type,q.relation,...(q.aliases||[])].join(" ").toLowerCase();
   return hay.includes(t);
 });
 const shown=t?list:list.slice(0,50);
 const header=t?`<div class="small" style="padding:8px 12px;background:#f7f9fc"><b>${list.length}개 검색 결과</b>${list.length>50?" · 상위 50개 표시":""}</div>`:`<div class="small" style="padding:8px 12px;background:#f7f9fc">전체 ${ALL_QUALIFICATIONS.length}개 · 검색하면 일치 항목이 모두 표시됩니다.</div>`;
 document.getElementById("qualList").innerHTML=header+shown.map(q=>`<label class="checkrow"><input type="checkbox" ${selectedQuals.has(q.id)?"checked":""} onchange="toggleQual('${q.id}',this.checked)"><span><b>${esc(q.name)}</b><br><span class="small">${esc(q.type)} · ${esc(q.relation)}</span></span></label>`).join("")||(header+'<p class="muted" style="padding:12px">검색 결과가 없습니다.</p>');
 document.getElementById("selectedQualList").innerHTML=[...selectedQuals].map(id=>{const q=ALL_QUALIFICATIONS.find(x=>x.id===id);return q?`<span class="chip">${esc(q.name)}</span>`:""}).join("");
}

}

function encodeShareData(obj){
  const json=JSON.stringify(obj);
  const bytes=new TextEncoder().encode(json);
  let binary=''; for(const b of bytes) binary+=String.fromCharCode(b);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeShareData(str){
  try{
    const base=str.replace(/-/g,'+').replace(/_/g,'/');
    const pad=base+'='.repeat((4-base.length%4)%4);
    const bin=atob(pad); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){return null}
}
